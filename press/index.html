<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Press — CMYK High SIS / LMS</title>
  <meta name="description" content="Press is CMYK High’s school operating system: A/B/C blocks, AI academics with a human guide, and explicit skills curriculum with evidence." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="sr-only" href="#viewRoot">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
        <div>
          <div class="brand-word">Press</div>
          <small>CMYK High OS</small>
        </div>
      </div>

      <div class="role-switch" role="group" aria-label="Preview role">
        <button type="button" data-role="student" class="active">Student</button>
        <button type="button" data-role="guide">Guide</button>
        <button type="button" data-role="admin">Admin</button>
      </div>

      <nav class="nav-list" id="navList" aria-label="Press modules"></nav>

        <strong>Prototype v0</strong>

        <div class="mt-12"><a href="../index.html" style="font-weight:700;color:var(--ink)">← CMYK High site</a></div>
      </div>
    </aside>

    <main class="main">
      <div id="contextLine" class="mono muted" style="margin-bottom:10px"></div>
      <div id="viewRoot" class="view active"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>

</html>
